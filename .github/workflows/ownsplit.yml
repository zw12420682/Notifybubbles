name: OwnSplit RootHide arm64e CI
on:
  push:
    branches: [ownsplit-dev]
    paths: ['OwnSplit/**', '.github/workflows/ownsplit.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Static and policy tests
        run: |
          python3 OwnSplit/scripts/test_ownsplit_contracts.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('OwnSplit/Sources')
          forbidden=['OSOverlayController','OSSplitManager','DPPassthroughView','kDP']
          bad=[]
          for f in p.glob('*'):
            if f.is_file():
              s=f.read_text(errors='ignore')
              for x in forbidden:
                if x in s:bad.append(f'{f}: {x}')
          if bad:raise SystemExit('\n'.join(bad))
          print('PASS no retired symbols')
          PY
      - name: Install package tooling
        run: brew install ldid xz dpkg
      - name: Install pinned RootHide Theos + SDK
        env:
          THEOS: ${{ github.workspace }}/.theos-toolchain
        run: |
          set -euo pipefail
          if [ ! -d "$THEOS/.git" ]; then
            git init "$THEOS"
            git -C "$THEOS" remote add origin https://github.com/roothide/theos.git
            git -C "$THEOS" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
            git -C "$THEOS" checkout --detach FETCH_HEAD
            git -C "$THEOS" submodule update --init --recursive --depth 1
          fi
          git init "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" remote add origin https://github.com/theos/sdks.git
          git -C "$RUNNER_TEMP/sdks" fetch --depth 1 origin 0222fd5413cf4b9af096f37b4621afa2688572f7
          git -C "$RUNNER_TEMP/sdks" checkout --detach FETCH_HEAD
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Build arm64e roothide package
        env:
          THEOS: ${{ github.workspace }}/.theos-toolchain
          THEOS_PACKAGE_SCHEME: roothide
        run: |
          set -euo pipefail
          cd OwnSplit
          make clean >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 ARCHS=arm64e THEOS_PACKAGE_SCHEME=roothide -j2 2>&1 | tee build.log
          dpkg-deb -I packages/*.deb
          dpkg-deb -c packages/*.deb
          dpkg-deb -f packages/*.deb Architecture | grep -Fx iphoneos-arm64e
          python3 - <<'PY'
          import glob,subprocess
          p=glob.glob('packages/*.deb')[0]
          listing=subprocess.check_output(['dpkg-deb','-c',p],text=True)
          if 'Library/MobileSubstrate/DynamicLibraries/OwnSplit.dylib' not in listing:raise SystemExit('missing var/jb dylib')
          if 'Library/MobileSubstrate/DynamicLibraries/OwnSplit.plist' not in listing:raise SystemExit('missing var/jb filter plist')
          if 'var/jb/' in listing:raise SystemExit('unexpected /var/jb prefix')
          print('PASS roothide package paths')
          PY
          shasum -a 256 packages/*.deb > packages/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OwnSplit-roothide-arm64e-dev
          path: |
            OwnSplit/packages/*.deb
            OwnSplit/packages/SHA256SUMS.txt
            OwnSplit/build.log
          if-no-files-found: error
          retention-days: 30
