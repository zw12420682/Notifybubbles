name: Build DEB (rootless + roothide)

# Builds two flavours of the same tweak from one source tree:
#   rootless -> /var/jb payload, DEB Architecture: iphoneos-arm64
#               (Dopamine/palera1n rootless, any /var/jb bootstrap)
#   roothide -> bootstrap-root payload, DEB Architecture: iphoneos-arm64e
#               (Dopamine RootHide)
#
# Toolchain note: roothide/theos is a superset of upstream theos. It ships the
# regular `rootless` scheme/package script as well as `roothide`, so a single
# pinned roothide/theos checkout builds BOTH variants and no second Theos tree
# (or conditional install) is needed. If you ever switch to official theos,
# note that only the rootless variant would remain buildable there.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']

permissions:
  contents: read

# Workflow-level concurrency cannot reference `matrix` (no matrix exists at this
# scope and GitHub rejects the file at parse time). Group per ref only; the
# build job adds its own scheme-scoped group so the two variants do not cancel
# each other.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Portable checks + Objective-C unit tests; independent of the package scheme.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # History-free guard fixtures: this checkout has no baseline commit, so the
      # source guards must pass here exactly as they do in a full clone.
      - name: Validate project files
        run: python3 scripts/validate.py
      - name: Test validation for overlay source updates
        run: python3 scripts/test_validator.py
      - name: Test Objective-C source guards (struct state, ARC bridges, duplicate selectors)
        run: |
          python3 scripts/test_objc_guards.py
          python3 scripts/test_objc_guards.py --self-test
      - name: Test retired keyboard cleanup
        run: python3 scripts/test_cleanup.py
      - name: Test scheme switching without a toolchain
        run: python3 scripts/test_scheme.py
      - name: Run notification state tests
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fmodules -Wall -Wextra -Werror \
            -framework Foundation -I Sources Sources/NFBInterfaces.m Sources/NFBStore.m Tests/StoreTests.m \
            -o "$RUNNER_TEMP/test-store"
          "$RUNNER_TEMP/test-store"
      - name: Test TrollOpen adapter contracts
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fmodules -Wall -Wextra -Werror \
            -DNFB_PORTABLE_ADAPTER_TEST -framework Foundation -I Sources Sources/NFBInterfaces.m Sources/NFBDebugLog.m Sources/NFBTrollOpen.m Tests/TrollOpenTests.m \
            -o "$RUNNER_TEMP/test-trollopen"
          for mode in missing wrongReturn wrongFlag throws valid desktop innerOnly frontMissing frontWrongReturn frontWrongArgs frontThrows frontValid floatMissing floatWrongReturn floatMini floatVisible; do
            "$RUNNER_TEMP/test-trollopen" "$mode"
          done
      - name: Test transition policy and private interfaces
        run: |
          clang -std=c11 -Wall -Wextra -Werror -I Sources Tests/TransitionTests.c -o "$RUNNER_TEMP/test-transition"
          "$RUNNER_TEMP/test-transition"
          clang -std=c11 -Wall -Wextra -Werror -I Sources Tests/ActionGestureTests.c -o "$RUNNER_TEMP/test-action-gesture"
          "$RUNNER_TEMP/test-action-gesture"
          xcrun --sdk macosx clang -fobjc-arc -fmodules -Wall -Wextra -Werror \
            -framework Foundation -I Sources Sources/NFBInterfaces.m Sources/NFBDebugLog.m Tests/InterfaceTests.m -o "$RUNNER_TEMP/test-interface"
          "$RUNNER_TEMP/test-interface"
          python3 scripts/test_package_parser.py
      - name: Test desktop view transfer and restoration in iOS simulator
        run: python3 scripts/test_desktop_simulator.py
      - name: Test independent state restoration
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fmodules -Wall -Wextra -Werror \
            -framework Foundation -I Sources Sources/NFBDebugLog.m Sources/NFBStateLedger.m Tests/StateLedgerTests.m \
            -o "$RUNNER_TEMP/test-state-ledger"
          "$RUNNER_TEMP/test-state-ledger"

      - name: Test rail layout wiring without a toolchain
        run: python3 scripts/test_rail_layout.py
      - name: Test layout/burst/drag/metric/probe policies (-Werror)
        run: |
          clang -std=c11 -Wall -Wextra -Werror -I Sources Tests/PolicyTests.c -lm -o "$RUNNER_TEMP/test-policies"
          "$RUNNER_TEMP/test-policies"
          python3 scripts/test_policies.py
      - name: Test column geometry (split, fullscreen, collapsed, empty)
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fmodules -Wall -Wextra -Werror \
            -framework Foundation -I Sources Tests/RailLayoutTests.m -o "$RUNNER_TEMP/test-rail-layout"
          "$RUNNER_TEMP/test-rail-layout"

  build:
    needs: test
    runs-on: macos-15-intel
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            artifact: NotifyBubbles-rootless
            arch: iphoneos-arm64
          - scheme: roothide
            artifact: NotifyBubbles-roothide
            arch: iphoneos-arm64e
    name: Package ${{ matrix.scheme }} (${{ matrix.arch }})
    # Scheme-scoped so a new push cancels only the same variant.
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.scheme }}
      cancel-in-progress: true
    env:
      THEOS: ${{ github.workspace }}/.theos-toolchain
      # Pinned roothide/theos commit: builds both rootless and roothide schemes.
      THEOS_REF: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
      SDKS_REF: 0222fd5413cf4b9af096f37b4621afa2688572f7
      THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ env.THEOS_REF }}-v1
      - name: Install packaging tools
        run: brew install ldid xz dpkg
      - name: Install pinned RootHide Theos and iOS SDK
        run: |
          set -euo pipefail
          if [ ! -d "$THEOS/.git" ]; then
            git init "$THEOS"
            git -C "$THEOS" remote add origin https://github.com/roothide/theos.git
            git -C "$THEOS" fetch --depth 1 origin "$THEOS_REF"
            git -C "$THEOS" checkout --detach FETCH_HEAD
            git -C "$THEOS" submodule update --init --recursive --depth 1
          fi
          git init "$RUNNER_TEMP/ios-sdks"
          git -C "$RUNNER_TEMP/ios-sdks" remote add origin https://github.com/theos/sdks.git
          git -C "$RUNNER_TEMP/ios-sdks" fetch --depth 1 origin "$SDKS_REF"
          git -C "$RUNNER_TEMP/ios-sdks" checkout --detach FETCH_HEAD
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/ios-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          xcodebuild -version
      - name: Build ${{ matrix.scheme }} package
        run: |
          set -euo pipefail
          chmod 755 layout/DEBIAN/postinst
          make clean >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}" -j2 2>&1 | tee "build-${{ matrix.scheme }}.log"
      - name: Verify DEB architecture, scheme prefix and payload
        run: |
          set -euo pipefail
          ls -l packages 2>/dev/null || true
          python3 scripts/check_package.py --scheme "${{ matrix.scheme }}" packages/*.deb
          shasum -a 256 packages/*.deb > "packages/SHA256SUMS-${{ matrix.scheme }}.txt"
      - name: Upload ${{ matrix.scheme }} DEB
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/*.deb
            packages/SHA256SUMS-${{ matrix.scheme }}.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload ${{ matrix.scheme }} build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}-build-log
          path: build-${{ matrix.scheme }}.log
          if-no-files-found: ignore

  release-notes:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise produced packages
        run: |
          {
            echo '## NotifyBubbles 0.48.90 — 双方案构建完成'
            echo ''
            echo '| 方案 | Artifact | DEB Architecture | 安装位置 |'
            echo '| --- | --- | --- | --- |'
            echo '| rootless | NotifyBubbles-rootless | iphoneos-arm64 | `/var/jb/...` |'
            echo '| roothide | NotifyBubbles-roothide | iphoneos-arm64e | RootHide bootstrap 根 |'
            echo ''
            echo '按设备实际情况安装其中一个，不要同时安装两个。'
          } >> "$GITHUB_STEP_SUMMARY"
